<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#10151c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .title { fill:#f0f6fc; font-size:24px; font-weight:700; }
      .subtitle { fill:#8b949e; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
      .prompt { fill:#7ee787; font-size:14px; }
      .label { fill:#8b949e; font-size:14px; }
      .value { fill:#e6edf3; font-size:15px; font-weight:600; }
      .small { fill:#8b949e; font-size:12px; }
      .pillText { fill:#c9d1d9; font-size:12px; font-weight:600; }
    </style>
  </defs>

  <rect x="16" y="16" width="728" height="388" rx="22" fill="url(#panel)" stroke="#30363d" filter="url(#shadow)"/>

  <!-- header -->
  <rect x="16" y="16" width="728" height="62" rx="22" fill="url(#headerGrad)"/>
  <rect x="16" y="56" width="728" height="22" fill="url(#headerGrad)"/>
  <circle cx="44" cy="47" r="6" fill="#ff5f56"/>
  <circle cx="64" cy="47" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="47" r="6" fill="#27c93f"/>
  <text x="108" y="52" class="mono prompt">metincan01@github:~$ neofetch</text>
  <rect x="612" y="34" width="106" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="665" y="50" text-anchor="middle" class="sans small">PROFILE CARD</text>

  <!-- left accent column -->
  <rect x="40" y="102" width="4" height="244" rx="2" fill="url(#accent)"/>
  <text x="60" y="110" class="sans subtitle">developer profile</text>
  <text x="60" y="142" class="sans title">metincan01@github</text>
  <text x="60" y="164" class="sans small">clean, terminal-styled README identity card</text>

  <!-- detail rows -->

  <rect x="58" y="118" width="644" height="30" rx="10" fill="#0f141b" stroke="#1f2937" opacity="0.92"/>
  <text x="74" y="138" class="mono label">name</text>
  <text x="220" y="138" class="sans value">Metincan Özcan</text>

  <rect x="58" y="156" width="644" height="30" rx="10" fill="#0f141b" stroke="#1f2937" opacity="0.92"/>
  <text x="74" y="176" class="mono label">role</text>
  <text x="220" y="176" class="sans value">Frontend Developer</text>

  <rect x="58" y="194" width="644" height="30" rx="10" fill="#0f141b" stroke="#1f2937" opacity="0.92"/>
  <text x="74" y="214" class="mono label">focus</text>
  <text x="220" y="214" class="sans value">Web Design &amp; Coding</text>

  <rect x="58" y="232" width="644" height="30" rx="10" fill="#0f141b" stroke="#1f2937" opacity="0.92"/>
  <text x="74" y="252" class="mono label">languages</text>
  <text x="220" y="252" class="sans value">HTML • CSS • JavaScript • TypeScript</text>

  <rect x="58" y="270" width="644" height="30" rx="10" fill="#0f141b" stroke="#1f2937" opacity="0.92"/>
  <text x="74" y="290" class="mono label">editor</text>
  <text x="220" y="290" class="sans value">VS Code</text>

  <rect x="58" y="308" width="644" height="30" rx="10" fill="#0f141b" stroke="#1f2937" opacity="0.92"/>
  <text x="74" y="328" class="mono label">os</text>
  <text x="220" y="328" class="sans value">Windows 11</text>

  <line x1="58" y1="356" x2="702" y2="356" stroke="#21262d"/>

  <rect x="58" y="372" width="76" height="24" rx="12" fill="#111827" stroke="#30363d"/>
  <text x="96" y="388" text-anchor="middle" class="sans pillText">frontend</text>

  <rect x="142" y="372" width="78" height="24" rx="12" fill="#111827" stroke="#30363d"/>
  <text x="181" y="388" text-anchor="middle" class="sans pillText">ui / ux</text>

  <rect x="228" y="372" width="92" height="24" rx="12" fill="#111827" stroke="#30363d"/>
  <text x="274" y="388" text-anchor="middle" class="sans pillText">typescript</text>

  <rect x="454" y="372" width="190" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
  <rect x="454" y="372" width="148" height="10" rx="5" fill="url(#accent)"/>
  <text x="454" y="398" class="sans small">currently building clean web experiences</text>
</svg>
